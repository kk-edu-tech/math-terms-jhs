<style>
:root{

  --warn:#fff4d8;--ok:#eaf8ef;--shadow:0 16px 42px rgba(15,87,199,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--navy);font-family:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.site-header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.header-inner{max-width:1180px;margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;color:var(--navy);text-decoration:none}
.logo{width:35px;height:35px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:22px}
.header-note{color:var(--muted);font-size:13px;font-weight:900}
main{max-width:1180px;margin:auto;padding:34px 20px 80px}
.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:24px;align-items:stretch;margin-bottom:26px}
.hero-main,.hero-card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.hero-main{padding:34px}
.eyebrow{display:inline-flex;padding:7px 12px;border-radius:999px;background:var(--soft);color:var(--blue-dark);font-weight:900;font-size:14px}
h1{margin:14px 0 10px;font-size:clamp(38px,5vw,62px);line-height:1.12;letter-spacing:-.04em}
.marker{color:var(--blue)}
.hero p{margin:0;color:#425466;font-size:18px;line-height:1.8;font-weight:700}
.hero-card{padding:24px;display:flex;flex-direction:column;justify-content:center}
.stat{display:flex;align-items:baseline;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf3f9}
.stat:last-child{border-bottom:0}
.stat b{font-size:30px;color:var(--blue)}.stat span{color:var(--muted);font-weight:800}
.search-panel{position:sticky;top:60px;z-index:15;background:rgba(246,249,255,.96);padding:12px 0 14px;backdrop-filter:blur(10px)}
.search-box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 28px rgba(15,87,199,.06)}
.search-row{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:10px}
.search-row input,.search-row select{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:#fff;color:var(--navy);font-weight:800}
.search-row input:focus,.search-row select:focus{outline:3px solid #cfe4ff;border-color:#8bbcf8}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-weight:900;color:var(--navy)}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 2px 14px}
.section-head h2{margin:0;font-size:29px}.count{color:var(--muted);font-weight:900}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.term-card{border:1px solid var(--line);background:#fff;border-radius:17px;padding:18px;text-align:left;box-shadow:0 8px 22px rgba(15,87,199,.05);transition:.18s ease;min-height:176px;display:flex;flex-direction:column}
.term-card:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(15,87,199,.10);border-color:#afd0fa}
.card-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;background:var(--soft);color:var(--blue-dark)}
.pill.warn{background:var(--warn);color:#8a4b00}
.term-card h3{margin:0 0 9px;font-size:23px;line-height:1.35}
.term-card p{margin:0;color:#425466;font-weight:700;line-height:1.65}
.card-bottom{margin-top:auto;padding-top:14px;color:var(--blue);font-weight:900;font-size:13px}
.empty{grid-column:1/-1;background:#fff;border:1px dashed #b9d5f8;border-radius:18px;padding:34px;text-align:center;color:var(--muted);font-weight:900}
.overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(11,31,77,.25);z-index:50;padding:18px}
.overlay.open{display:grid}
.detail{width:min(760px,96vw);max-height:88vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 28px 80px rgba(11,31,77,.25);padding:25px}
.detail-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.detail h2{margin:8px 0 0;font-size:clamp(34px,5vw,50px);line-height:1.15}
.close{border:1px solid var(--line);background:var(--soft);color:var(--navy);border-radius:12px;width:42px;height:42px;font-size:26px;font-weight:900}
.detail-summary{font-size:22px;line-height:1.75;font-weight:800;color:#233a59;margin:22px 0}
.formula{min-height:0;border-radius:16px;background:#f9fbff;border:1px solid var(--line);padding:20px;text-align:center;font-size:28px;font-weight:900;margin:14px 0}
.formula:empty{display:none}
.block-title{font-size:13px;color:var(--muted);font-weight:900;letter-spacing:.08em;margin:20px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid #bfd8f8;background:#fff;color:var(--blue-dark);padding:8px 11px;border-radius:999px;font-weight:900}
.keyword{cursor:default;color:#425466;background:#f8fbff}
.notice{margin-top:18px;padding:12px 14px;border-radius:14px;background:var(--warn);color:#784600;font-weight:800;line-height:1.6}
footer{max-width:1180px;margin:auto;padding:0 20px 36px;color:var(--muted);font-weight:700;line-height:1.7}
@media(max-width:900px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){main{padding:20px 12px 70px}.header-inner{padding:10px 12px}.header-note{display:none}.hero-main{padding:24px}.search-panel{top:54px}.search-row{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.detail{padding:20px}.detail-summary{font-size:20px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

.slide-link-wrap{margin-top:18px}
.slide-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--blue);background:var(--blue);color:#fff;text-decoration:none;border-radius:14px;padding:14px 16px;font-size:20px;font-weight:900;box-shadow:0 10px 24px rgba(22,114,243,.18)}
.slide-link:hover{background:var(--blue-dark);border-color:var(--blue-dark)}

      <h1>数学用語を、<br><span class="marker">見てわかる。</span></h1>
      <p>中学1年の100用語を、単元・ことば・意味から探せます。用語を押すと、一言説明・数式・関連用語をまとめて確認できます。</p>

  <section class="search-panel">
    <div class="search-box">
      <div class="search-row">
        <input id="q" type="search" placeholder="例：比例、マイナス、直角、中央値…">
        <select id="unitSelect">
          <option value="all">すべての単元</option>
          <option value="g1-seifu">正の数・負の数</option><option value="g1-moji">文字の式</option><option value="g1-hoteishiki">方程式</option><option value="g1-henkatotaiou">比例・反比例</option><option value="g1-heimen">平面図形</option><option value="g1-kukan">空間図形</option><option value="g1-data">データの活用</option>
        </select>
      </div>
      <div class="tabs">
        <button class="tab active" data-status="all">すべて</button>
        <button class="tab" data-status="ok">内容確認済み</button>
        <button class="tab" data-status="revise">要修正</button>
      </div>
    </div>
  </section>

  <div class="section-head">
    <h2>1年生の数学用語</h2>
    <div class="count" id="count"></div>
  </div>
  <section class="grid" id="grid"></section>
</main>

<div class="overlay" id="overlay" aria-hidden="true">

    <div id="relatedBlock">

    </div>

    <div class="notice" id="notice" hidden>この用語の一言説明は「要修正」判定です。現在のレビュー文をそのまま表示しています。</div>
  </section>
</div>

const byId=Object.fromEntries(TERMS.map(t=>[t.id,t]));
const grid=document.getElementById('grid');
const q=document.getElementById('q');
const unitSelect=document.getElementById('unitSelect');
const count=document.getElementById('count');
let status='all';

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normalized(t){return (t.name+' '+t.summary+' '+t.unit+' '+t.category+' '+t.keywords.join(' ')).toLowerCase()}

function render(){
  const query=q.value.trim().toLowerCase();
  const unit=unitSelect.value;
  const list=TERMS.filter(t=>{
    if(unit!=='all'&&t.unitId!==unit)return false;
    if(status!=='all'&&t.status!==status)return false;
    if(query&&!normalized(t).includes(query))return false;
    return true;
  });
  count.textContent=`${list.length} / ${TERMS.length}語`;
  if(!list.length){
    grid.innerHTML='<div class="empty">条件に合う用語が見つかりませんでした。</div>';
    return;
  }
  grid.innerHTML=list.map(t=>`
    <button class="term-card" data-id="${t.id}">
      <div class="card-meta">
        <span class="pill">${esc(t.unit)}</span>
        ${t.status==='revise'?'<span class="pill warn">要修正</span>':'<span class="pill">確認済み</span>'}
      </div>
      <h3>${esc(t.name)}</h3>
      <p>${esc(t.summary)}</p>
      <div class="card-bottom">解説スライドを見る →</div>
    </button>`).join('');
}

function openDetail(id){
  const t=byId[id]; if(!t)return;
  document.getElementById('detailTitle').textContent=t.name;
  document.getElementById('detailSummary').textContent=t.summary;
  document.getElementById('detailMeta').innerHTML=`<span class="pill">${esc(t.unit)}</span><span class="pill">${esc(t.category)}</span>${t.status==='revise'?'<span class="pill warn">要修正</span>':'<span class="pill">確認済み</span>'}`;
  const f=document.getElementById('detailFormula');
  f.innerHTML=t.formula||'';
  f.style.display=t.formula?'block':'none';
  document.getElementById('keywords').innerHTML=t.keywords.length?t.keywords.map(x=>`<span class="chip keyword">${esc(x)}</span>`).join(''):'<span class="chip keyword">登録なし</span>';
  document.getElementById('related').innerHTML=t.related.length?t.related.map(r=>{
    const rt=byId[r]; return rt?`<button class="chip related-chip" data-id="${rt.id}">${esc(rt.name)}</button>`:'';
  }).join(''):'<span class="chip keyword">登録なし</span>';
  const slideBlock=document.getElementById('slideLinkBlock');
  if(t.slideUrl){
    slideBlock.hidden=false;
    slideBlock.innerHTML=`<a class="slide-link" href="${t.slideUrl}" target="_blank" rel="noopener">▶ 解説スライドを見る</a>`;
  }else{
    slideBlock.hidden=true;
    slideBlock.innerHTML='';
  }
  document.getElementById('notice').hidden=t.status!=='revise';
  overlay.classList.add('open'); overlay.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  if(window.MathJax?.typesetPromise&&t.formula) MathJax.typesetPromise([f]).catch(()=>{});
}

function closeDetail(){
  overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.style.overflow='';
}

grid.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)openDetail(b.dataset.id)});
document.getElementById('related').addEventListener('click',e=>{const b=e.target.closest('.related-chip');if(b)openDetail(b.dataset.id)});
q.addEventListener('input',render);unitSelect.addEventListener('change',render);
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  status=b.dataset.status;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render();
}));
document.getElementById('closeBtn').addEventListener('click',closeDetail);
overlay.addEventListener('click',e=>{if(e.target===overlay)closeDetail()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});
render();
</script>
