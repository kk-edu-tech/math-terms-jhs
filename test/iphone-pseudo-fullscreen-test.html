<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPhone 擬似全画面テスト</title>
<style>
:root{
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --blue-soft:#eff6ff;
  --text:#0f172a;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#f8fbff;
  color:var(--text);
  font-family:"Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;
}
body{
  padding:20px;
}
.wrap{
  min-height:calc(100dvh - 40px);
  display:grid;
  place-items:center;
}
.card{
  width:min(92vw,760px);
  background:#fff;
  border:1px solid #dbeafe;
  border-radius:16px;
  padding:32px;
  box-shadow:0 18px 50px rgba(15,23,42,.10);
  text-align:center;
}
h1{
  margin:0 0 18px;
  font-size:clamp(36px,9vw,72px);
  line-height:1.15;
}
p{
  font-size:clamp(20px,5vw,30px);
  line-height:1.6;
  margin:0 0 24px;
}
button{
  border:1px solid #bfdbfe;
  background:var(--blue);
  color:#fff;
  border-radius:10px;
  padding:14px 22px;
  font-size:20px;
  font-weight:900;
  min-width:180px;
  cursor:pointer;
}

/* 擬似全画面 */
body.pseudo-fullscreen{
  padding:0;
  overflow:hidden;
  background:#fff;
}
body.pseudo-fullscreen .wrap{
  width:100vw;
  height:100dvh;
  min-height:100dvh;
  padding:
    max(12px, env(safe-area-inset-top))
    max(12px, env(safe-area-inset-right))
    max(12px, env(safe-area-inset-bottom))
    max(12px, env(safe-area-inset-left));
}
body.pseudo-fullscreen .card{
  width:100%;
  height:100%;
  max-width:none;
  border:0;
  border-radius:0;
  box-shadow:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
body.pseudo-fullscreen h1{
  font-size:clamp(48px,13vw,88px);
}
.status{
  margin-top:18px;
  font-size:16px;
  font-weight:800;
  color:var(--blue-dark);
}
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <h1>関数って何？</h1>
    <p>
      \(x\) の値を1つ決めると、<br>
      \(y\) の値がただ1つに決まる関係。
    </p>
    <button id="toggleBtn" type="button">大きく表示</button>
    <div class="status" id="status">通常表示</div>
  </main>
</div>

<script>
(() => {
  const btn = document.getElementById('toggleBtn');
  const status = document.getElementById('status');

  function updateUI(){
    const active = document.body.classList.contains('pseudo-fullscreen');
    btn.textContent = active ? '大きく表示を解除' : '大きく表示';
    status.textContent = active ? '擬似全画面モード' : '通常表示';
  }

  btn.addEventListener('click', () => {
    document.body.classList.toggle('pseudo-fullscreen');
    updateUI();
  });

  updateUI();
})();
</script>
</body>
</html>
